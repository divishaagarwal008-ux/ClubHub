<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubHub — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f3259 0%, #1a4f8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand { font-size: 1.8rem; font-weight: 700; color: #1a4f8a; }
        .btn-login { background: #1a4f8a; border: none; padding: 0.75rem; font-size: 1rem; font-weight: 600; }
        .btn-login:hover { background: #0f3259; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand"><i class="bi bi-mortarboard-fill text-warning"></i> ClubHub</div>
        <p class="text-muted mt-1">Student Club Management System</p>
    </div>
    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-login btn-primary w-100 rounded-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
        {% if error %}<div class="alert alert-danger mt-3 mb-0">{{ error }}</div>{% endif %}
    </form>
</div>
</body>
</html>
