<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ClubHub</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1a4f8a;
            --primary-dark: #0f3259;
            --primary-light: #e8f0fe;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary-color);
            font-size: 2rem;
        }

        .brand-title {
            color: var(--primary-dark);
            font-weight: 700;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(26, 79, 138, 0.25);
        }

        .btn-login {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            font-weight: 600;
        }

        .btn-login:hover,
        .btn-login:focus {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="card login-card">
    <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="brand-icon mb-3">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h1 class="h3 brand-title mb-1">ClubHub</h1>
            <p class="text-muted small mb-0">Student Club &amp; Organisation Management System</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Demo credentials: <code>admin</code> / <code>admin123</code>
        </p>
    </div>
</div>

</body>
</html>
